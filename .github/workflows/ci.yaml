name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: make check (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: make check
        run: make check PYTHON=python

  integration:
    name: make test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test-integration
        run: make test-integration
